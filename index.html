<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batman Grade Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #f5f5f5;
      background: radial-gradient(circle at top, #343434 0%, #171717 45%, #050505 100%);
    }

    .calculator {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      text-align: center;
      background: #202020;
      border: 2px solid #f5c518;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .calculator:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 40px rgba(245, 197, 24, 0.16);
    }

    .bat-symbol {
      display: inline-block;
      margin-bottom: 8px;
      padding: 10px 18px;
      color: #111;
      background: #f5c518;
      border-radius: 50%;
      font-size: 26px;
      font-weight: bold;
    }

    h1 {
      margin: 8px 0;
      color: #f5c518;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #c7c7c7;
      font-size: 14px;
    }

    .marks {
      display: grid;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      color: #fff;
      background: #111;
      border: 1px solid #555;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #f5c518;
      box-shadow: 0 0 0 3px rgba(245, 197, 24, 0.18);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      color: #111;
      background: #f5c518;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background: #ffda4d;
      transform: scale(1.03);
    }

    button:active {
      transform: scale(0.98);
    }

    #result {
      margin: 22px 0 0;
      padding: 14px;
      color: #f5c518;
      background: #111;
      border-radius: 10px;
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 420px) {
      .calculator {
        padding: 23px 18px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="calculator">
    <div class="bat-symbol" aria-hidden="true">🦇</div>
    <h1>Grade Calculator</h1>
    <p class="subtitle">Enter your marks for all five subjects</p>

    <div class="marks">
      <input type="number" placeholder="Subject 1 mark (0–100)" id="mark1" min="0" max="100">
      <input type="number" placeholder="Subject 2 mark (0–100)" id="mark2" min="0" max="100">
      <input type="number" placeholder="Subject 3 mark (0–100)" id="mark3" min="0" max="100">
      <input type="number" placeholder="Subject 4 mark (0–100)" id="mark4" min="0" max="100">
      <input type="number" placeholder="Subject 5 mark (0–100)" id="mark5" min="0" max="100">
    </div>

    <button type="button" onclick="grade()">Calculate Grade</button>
    <h2 id="result" aria-live="polite">Your result will appear here</h2>
  </main>

  <script>
    function grade() {
      const marks = [];

      for (let i = 1; i <= 5; i++) {
        const input = document.getElementById("mark" + i);
        const value = input.value.trim();

        if (value === "" || Number(value) < 0 || Number(value) > 100) {
          document.getElementById("result").textContent =
            "Please enter a mark from 0 to 100 in every box.";
          input.focus();
          return;
        }

        marks.push(Number(value));
      }

      const sum = marks.reduce((total, mark) => total + mark, 0);
      const avg = sum / marks.length;
      let letterGrade;

      if (avg >= 90) {
        letterGrade = "A+";
      } else if (avg >= 80) {
        letterGrade = "A";
      } else if (avg >= 70) {
        letterGrade = "B";
      } else if (avg >= 60) {
        letterGrade = "C";
      } else if (avg >= 50) {
        letterGrade = "D";
      } else {
        letterGrade = "F";
      }

      document.getElementById("result").textContent =
        "Average: " + avg.toFixed(2) + "% | Grade: " + letterGrade;
    }
  </script>
</body>
</html>
